name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Prepare dependencies (Xcode)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make

      - name: Get Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Release version always follows the pushed tag (v1.2.3 -> 1.2.3)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            PLIST=$(find _build -path "*.app/Info.plist" 2>/dev/null | head -n 1 || true)
            VERSION=""
            if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
              VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST" 2>/dev/null || true)
            fi
            [ -z "$VERSION" ] && VERSION="0.0.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Version: ${VERSION}"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: XSign-IPA
          path: packages/*.ipa
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: XSign v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            packages/*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
