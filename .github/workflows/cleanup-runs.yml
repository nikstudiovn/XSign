name: Cleanup Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release.yml runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo ${{ github.repository }} --workflow release.yml --limit 100 --json databaseId,number --jq '.[] | select(.number <= 56) | .databaseId' | while read -r id; do
            echo "Deleting run ID: $id"
            gh run delete "$id" --repo ${{ github.repository }} </dev/null
          done
